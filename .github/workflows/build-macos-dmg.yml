name: C14 native macOS guest checks
run-name: C14 native Intel ${{ inputs.source_ref }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to build and execute
        required: true
        type: string
permissions:
  contents: read
jobs:
  intel-guest:
    if: github.repository == 'reinauer/WinUAE'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Verify native host and source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test "$(uname -m)" = x86_64
          sysctl machdep.cpu.brand_string
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || true)" != 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: tools/c14-ci
      - name: Install build dependencies
        run: brew install cmake ninja pkgconf flac libmpeg2 lua
      - name: Build native emulator
        run: |
          cmake -S . -B build/c14 -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DWINUAE_UNIX_WITH_QT_UI=OFF \
            -DWINUAE_UNIX_WITH_SDL3=OFF \
            -DWINUAE_UNIX_WITH_FLOPPYBRIDGE=OFF \
            -DWINUAE_UNIX_WITH_PRINTER_EMULATION=OFF \
            -DWINUAE_UNIX_BUILD_QEMU_UAE_PLUGIN=OFF \
            -DWINUAE_UNIX_EXTERNAL_QEMU_UAE_PLUGIN=ON
          cmake --build build/c14 --target winuae_unix winuae_unix_tests --parallel 3
          file build/c14/winuae
          ctest --test-dir build/c14 --output-on-failure
      - name: Run native guest matrix
        run: python3 harness/tools/c14-ci/run.py build/c14/winuae .
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c14-native-intel
          path: |
            build/c14-native/*/runtime.log
            build/c14-native/*/faults.json
            build/c14-native/*/guest/*.txt
            build/c14/CMakeCache.txt
